name: Inspect Tuveloz AI mobile rendering

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-ai-site.yml"

permissions:
  contents: read

jobs:
  inspect-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture public DNS and response headers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-inspection
          dig +noall +answer ai.tuveloz.com A ai.tuveloz.com AAAA ai.tuveloz.com CNAME \
            > mobile-inspection/public-dns.txt || true
          curl --fail --location --silent --show-error --head https://ai.tuveloz.com/ \
            > mobile-inspection/public-headers.txt

      - name: Capture 430px mobile screenshot
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser" || { echo "No Chromium browser is available"; exit 2; }
          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=430,1800 \
            --force-device-scale-factor=1 \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=8000 \
            --screenshot=mobile-inspection/ai-tuveloz-mobile.png \
            https://ai.tuveloz.com/

      - name: Upload mobile inspection
        uses: actions/upload-artifact@v4
        with:
          name: tuveloz-ai-mobile-render
          path: mobile-inspection
          if-no-files-found: error
          retention-days: 1
