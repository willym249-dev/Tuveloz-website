name: Check Tuveloz deadlines

on:
  schedule:
    # Every Monday at 13:00 UTC (09:00 US Eastern during daylight saving time).
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tuveloz-deadline-check
  cancel-in-progress: false

jobs:
  check:
    name: Report overdue and upcoming items
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Upcoming deadlines and overdue items

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0

      - name: Read the deadline register
        id: deadlines
        run: node scripts/check-deadlines.mjs

      - name: Find the existing issue
        id: existing
        run: |
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: steps.deadlines.outputs.needs_attention != '0'
        run: |
          {
            echo "Some items in the deadline register need attention."
            echo
            cat deadline-report.md
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > issue-body.md

          if [ -n "${{ steps.existing.outputs.number }}" ]; then
            gh issue edit "${{ steps.existing.outputs.number }}" --body-file issue-body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md
          fi

      - name: Close the issue when nothing is outstanding
        if: steps.deadlines.outputs.needs_attention == '0' && steps.existing.outputs.number != ''
        run: |
          gh issue close "${{ steps.existing.outputs.number }}" \
            --comment "Nothing is overdue and nothing is due in the next 30 days. Closing until something comes up."
