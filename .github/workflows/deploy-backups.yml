name: Deploy private backups

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bootstrap without a schedule, or activate after installing the D1 secret
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - activate

permissions:
  contents: read

concurrency:
  group: tuveloz-private-backup-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify backup behavior
        run: npm run backup:check
      - name: Prepare the private deployment
        env:
          BACKUP_DEPLOY_MODE: ${{ inputs.mode }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const mode = process.env.BACKUP_DEPLOY_MODE;
          if (!['bootstrap', 'activate'].includes(mode)) throw new Error('Invalid backup mode.');
          const config = JSON.parse(fs.readFileSync('backup-worker/wrangler.jsonc', 'utf8'));
          config.main = path.resolve('backup-worker/src/index.ts');
          if (mode === 'bootstrap') delete config.workflows[0].schedules;
          fs.mkdirSync('.wrangler', { recursive: true });
          fs.writeFileSync('.wrangler/backup-deploy.json', JSON.stringify(config));
          NODE
      - name: Validate the exact deployment configuration
        run: npx wrangler deploy --config .wrangler/backup-deploy.json --dry-run
      - name: Require the installed secret before activation
        if: inputs.mode == 'activate'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const output = execFileSync('./node_modules/.bin/wrangler', [
            'secret', 'list', '--name', 'tuveloz-production-backup',
            '--config', '.wrangler/backup-deploy.json',
          ], { encoding: 'utf8' });
          const names = JSON.parse(output);
          if (!names.some(secret => secret.name === 'D1_BACKUP_API_TOKEN' && secret.type === 'secret_text')) {
            throw new Error('Install D1_BACKUP_API_TOKEN directly in Cloudflare before activation.');
          }
          console.log('Required private secret is installed.');
          NODE
      - name: Deploy the backup Worker
        run: npx wrangler deploy --config .wrangler/backup-deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
