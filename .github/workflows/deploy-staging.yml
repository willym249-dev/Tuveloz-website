name: Deploy Tuveloz Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tuveloz-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Test, migrate, and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Stamp staging deployment metadata
        shell: bash
        run: |
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '%s\n' \
            '// Generated by the Tuveloz staging deployment workflow.' \
            "export const DEPLOYMENT_COMMIT = \"${GITHUB_SHA}\";" \
            "export const DEPLOYMENT_BUILT_AT = \"${built_at}\";" \
            > lib/deployment-release.ts

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test staging build
        run: npm test

      - name: Generate isolated staging configuration
        run: |
          test "$CI" = "true" || {
            echo "The staging deployment workflow may only generate wrangler.jsonc on a CI runner."
            exit 1
          }
          node scripts/generate-staging-wrangler.mjs wrangler.jsonc
        env:
          STAGING_D1_DATABASE_ID: ${{ secrets.STAGING_D1_DATABASE_ID }}
          STAGING_R2_BUCKET_NAME: ${{ secrets.STAGING_R2_BUCKET_NAME }}
          STAGING_OWNER_EMAIL: ${{ secrets.STAGING_OWNER_EMAIL }}
          STAGING_OWNER_ACCESS_AUD: ${{ secrets.STAGING_OWNER_ACCESS_AUD }}
          STAGING_TEAM_DOMAIN: ${{ secrets.STAGING_TEAM_DOMAIN }}

      - name: Apply staging database migrations
        run: npx wrangler d1 migrations apply tuveloz-staging-db --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy isolated staging Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove generated staging configuration
        if: always()
        run: rm -f wrangler.jsonc
