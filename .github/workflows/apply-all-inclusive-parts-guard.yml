name: Apply all-inclusive parts guard

on:
  push:
    branches:
      - agent/all-inclusive-parts-guard
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-all-inclusive-parts-guard
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/all-inclusive-parts-guard
          fetch-depth: 0

      - name: Apply source and legal policy safeguards
        run: |
          python3 scripts/apply-all-inclusive-parts-guard.py
          python3 scripts/apply-all-inclusive-parts-legal.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

      - name: Commit the validated implementation
        run: |
          rm scripts/apply-all-inclusive-parts-guard.py
          rm scripts/apply-all-inclusive-parts-legal.py
          rm .github/workflows/apply-all-inclusive-parts-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes were produced."
            exit 1
          fi
          git commit -m "Implement guarded all-inclusive provider parts quotes"
          git push origin HEAD:agent/all-inclusive-parts-guard
