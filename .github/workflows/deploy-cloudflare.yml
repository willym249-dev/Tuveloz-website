name: Deploy Tuveloz

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: tuveloz-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, migrate, and deploy
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Stamp deployment metadata
        shell: bash
        run: |
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '%s\n' \
            '// Generated by the verified GitHub deployment workflow.' \
            "export const DEPLOYMENT_COMMIT = \"${GITHUB_SHA}\";" \
            "export const DEPLOYMENT_BUILT_AT = \"${built_at}\";" \
            > lib/deployment-release.ts

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test production build
        run: npm test

      - name: Apply production database migrations
        if: github.event_name != 'pull_request'
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify exact live release and database readiness
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          STATUS_URL: https://tuveloz.com/api/health
        run: |
          node <<'NODE'
          const expected = process.env.EXPECTED_COMMIT;
          const statusUrl = process.env.STATUS_URL;
          const pause = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          (async () => {
            let lastResult = "No response received.";
            for (let attempt = 1; attempt <= 18; attempt += 1) {
              try {
                const url = new URL(statusUrl);
                url.searchParams.set("expected", expected);
                url.searchParams.set("attempt", String(attempt));
                url.searchParams.set("time", String(Date.now()));
                const response = await fetch(url, {
                  headers: {
                    "cache-control": "no-cache",
                    "user-agent": "Tuveloz-GitHub-Deployment-Verification",
                  },
                });
                const body = await response.text();
                let payload;
                try {
                  payload = JSON.parse(body);
                } catch {
                  payload = null;
                }

                if (
                  response.ok
                  && payload?.status === "ok"
                  && payload?.release?.commit === expected
                  && payload?.checks?.application === "ready"
                  && payload?.checks?.database === "ready"
                  && payload?.checks?.schema === "ready"
                  && payload?.launch?.mode === "onboarding_only"
                  && payload?.launch?.customerAccounts === "open"
                  && payload?.launch?.providerApplications === "open"
                  && payload?.launch?.customerJobRequests === "closed"
                  && payload?.launch?.customerPayments === "closed"
                  && Array.isArray(payload?.missingTables)
                  && payload.missingTables.length === 0
                  && Array.isArray(payload?.missingGuardedTriggers)
                  && payload.missingGuardedTriggers.length === 0
                ) {
                  console.log(`Verified live Tuveloz release ${expected}.`);
                  console.log(`Production health checked at ${payload.checkedAt}.`);
                  return;
                }

                lastResult = `Attempt ${attempt}: HTTP ${response.status}; body ${body.slice(0, 1200)}`;
              } catch (error) {
                lastResult = `Attempt ${attempt}: ${error instanceof Error ? error.message : String(error)}`;
              }
              console.log(lastResult);
              await pause(10_000);
            }

            throw new Error(
              `Cloudflare did not serve the exact healthy release ${expected}. ${lastResult}`,
            );
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish production deployment commit status
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'NODE'
          const token = process.env.GH_TOKEN;
          const repository = process.env.REPOSITORY;
          const commit = process.env.COMMIT_SHA;
          const jobStatus = process.env.JOB_STATUS;
          const targetUrl = process.env.RUN_URL;
          const state = jobStatus === "success"
            ? "success"
            : jobStatus === "cancelled"
              ? "error"
              : "failure";
          const description = state === "success"
            ? "Exact Cloudflare release and required D1 schema verified."
            : "Production migration, deployment, or live verification failed.";

          (async () => {
            const response = await fetch(
              `https://api.github.com/repos/${repository}/statuses/${commit}`,
              {
                method: "POST",
                headers: {
                  accept: "application/vnd.github+json",
                  authorization: `Bearer ${token}`,
                  "content-type": "application/json",
                  "user-agent": "Tuveloz-Production-Deployment",
                  "x-github-api-version": "2022-11-28",
                },
                body: JSON.stringify({
                  state,
                  context: "tuveloz/production-deployment",
                  description,
                  target_url: targetUrl,
                }),
              },
            );
            if (!response.ok) {
              throw new Error(`GitHub status API returned ${response.status}: ${(await response.text()).slice(0, 800)}`);
            }
            console.log(`Published ${state} production status for ${commit}.`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
