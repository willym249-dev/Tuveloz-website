name: Deploy Tuveloz

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tuveloz-production-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, migrate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Stamp deployment metadata
        shell: bash
        run: |
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '%s\n' \
            '// Generated by the verified GitHub deployment workflow.' \
            "export const DEPLOYMENT_COMMIT = \"${GITHUB_SHA}\";" \
            "export const DEPLOYMENT_BUILT_AT = \"${built_at}\";" \
            > lib/deployment-release.ts

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test production build
        run: npm test

      - name: Apply production database migrations
        if: github.event_name != 'pull_request'
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify exact live release and database readiness
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          STATUS_URL: https://tuveloz.com/api/health
        run: |
          node <<'NODE'
          const expected = process.env.EXPECTED_COMMIT;
          const statusUrl = process.env.STATUS_URL;
          const pause = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          (async () => {
            let lastResult = "No response received.";
            for (let attempt = 1; attempt <= 18; attempt += 1) {
              try {
                const url = new URL(statusUrl);
                url.searchParams.set("expected", expected);
                url.searchParams.set("attempt", String(attempt));
                url.searchParams.set("time", String(Date.now()));
                const response = await fetch(url, {
                  headers: {
                    "cache-control": "no-cache",
                    "user-agent": "Tuveloz-GitHub-Deployment-Verification",
                  },
                });
                const body = await response.text();
                let payload;
                try {
                  payload = JSON.parse(body);
                } catch {
                  payload = null;
                }

                if (
                  response.ok
                  && payload?.status === "ok"
                  && payload?.release?.commit === expected
                  && payload?.checks?.application === "ready"
                  && payload?.checks?.database === "ready"
                  && payload?.checks?.schema === "ready"
                  && Array.isArray(payload?.missingTables)
                  && payload.missingTables.length === 0
                ) {
                  console.log(`Verified live Tuveloz release ${expected}.`);
                  console.log(`Production health checked at ${payload.checkedAt}.`);
                  return;
                }

                lastResult = `Attempt ${attempt}: HTTP ${response.status}; body ${body.slice(0, 1200)}`;
              } catch (error) {
                lastResult = `Attempt ${attempt}: ${error instanceof Error ? error.message : String(error)}`;
              }
              console.log(lastResult);
              await pause(10_000);
            }

            throw new Error(
              `Cloudflare did not serve the exact healthy release ${expected}. ${lastResult}`,
            );
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
