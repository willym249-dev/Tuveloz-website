name: Verify Tuveloz

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tuveloz-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, and migrate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Spanish coverage
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Apply every migration to a fresh local D1 database
        run: |
          rm -rf .wrangler/state
          npm run db:migrate:local

      - name: Build
        run: npm run build

      - name: Verify rendered Spanish coverage
        env:
          BASE_URL: http://localhost:3000
        run: |
          npm run dev > /tmp/tuveloz-dev.log 2>&1 &
          DEV_SERVER_PID=$!
          trap 'kill $DEV_SERVER_PID; cat /tmp/tuveloz-dev.log' EXIT
          for attempt in {1..30}; do
            if curl -fsS "$BASE_URL/" > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "$BASE_URL/" > /dev/null
          npm run i18n:check

      # Boots a real dev server against the local D1 built above and drives the
      # whole provider signup flow, including the email gate. Delivery is
      # redirected to a loopback catcher, so no real address is ever contacted
      # and no Resend credential is needed — the runner has neither.
      - name: End-to-end provider signup
        run: npm run test:e2e
        timeout-minutes: 10
