name: Verify Tuveloz

# This ran only on pull_request until 2026-08-17, and the deploy workflow does
# not run every check it does. Three commits pushed straight to main on
# 2026-08-16 therefore reached production without the rendered Spanish check,
# the end-to-end signup, or the fresh-database migration rehearsal ever running
# against them, and /post-job served an untranslated English paragraph on its
# Spanish page for a day. A branch that only edited docs/LOG.md is what finally
# ran the check and found it.
#
# On main these checks are no longer a push trigger of their own. Deploy Tuveloz
# calls this workflow as the job its deploy depends on, so a commit that fails
# here is never released rather than being reported red shortly after it went
# live. Keeping the push trigger as well would run the whole suite twice for
# every merge.
on:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A superseded pull-request run is worth cancelling. A run reached through
  # workflow_call is a deploy's own gate -- cancelling it would strand the
  # release waiting on a result that is never coming.
  group: tuveloz-verify-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  account-signup:
    name: Browser account signup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # A separate checkout keeps this fixture's local D1 and dummy mail
      # settings isolated from the provider fixture in the verify job.
      - name: Create and sign in to a customer account in the browser
        run: npm run test:e2e:account

  verify:
    name: Lint, test, build, and migrate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Spanish coverage
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck application and Worker
        run: npm run typecheck

      - name: Apply every migration to a fresh local D1 database
        run: |
          rm -rf .wrangler/state
          npm run db:migrate:local

      - name: Build
        run: npm run build

      - name: Verify rendered Spanish coverage
        env:
          BASE_URL: http://localhost:3000
        run: |
          npm run dev > /tmp/tuveloz-dev.log 2>&1 &
          DEV_SERVER_PID=$!
          trap 'kill $DEV_SERVER_PID; cat /tmp/tuveloz-dev.log' EXIT
          for attempt in {1..30}; do
            if curl -fsS "$BASE_URL/" > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "$BASE_URL/" > /dev/null
          npm run i18n:check

      # Boots a real dev server against the local D1 built above and drives the
      # whole provider signup flow, including the email gate. Delivery is
      # redirected to a loopback catcher, so no real address is ever contacted
      # and no Resend credential is needed — the runner has neither.
      - name: End-to-end provider signup
        run: npm run test:e2e
        timeout-minutes: 10
