name: Verify Tuveloz

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tuveloz-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, and migrate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Apply every migration to a fresh local D1 database
        run: |
          rm -rf .wrangler/state
          npm run db:migrate:local

      - name: Build
        run: npm run build

      # Boots a real dev server against the local D1 built above and drives the
      # whole signup flow, including the email gate. Delivery is redirected to a
      # loopback catcher, so no real address is ever contacted and no Resend
      # credential is needed — the runner has neither.
      - name: End-to-end provider signup
        run: npm run test:e2e
        timeout-minutes: 10
