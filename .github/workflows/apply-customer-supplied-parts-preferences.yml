name: Apply customer-supplied parts preferences

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/apply-customer-supplied-parts-preferences.yml
      - scripts/apply_labor_only_core.py.gz.b64
      - scripts/apply_labor_only_ui.py.gz.b64
      - scripts/apply_labor_only_hardening.py.gz.b64.part.*

permissions:
  contents: write

concurrency:
  group: apply-customer-supplied-parts-preferences-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Integrate current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tuveloz Automation'
          git config user.email 'actions@users.noreply.github.com'
          git merge --no-edit origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Decode and apply labor-only patches
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/apply_labor_only_hardening.py.gz.b64.part.* > scripts/apply_labor_only_hardening.py.gz.b64
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          core_path = Path("scripts/apply_labor_only_core.py.gz.b64")
          core = core_path.read_text().strip()
          core = core.replace("+way8KW", "+may8KW").rstrip("=")
          expected_core = "814510317304c0342e0dae529f0f8860f35330fe3e234d6c50a2fa34a078642e"
          if sha256(core.encode()).hexdigest() != expected_core:
              raise SystemExit("Core labor-only payload checksum did not match.")
          core_path.write_text(core)

          ui_path = Path("scripts/apply_labor_only_ui.py.gz.b64")
          ui = ui_path.read_text().strip()
          expected_ui = "6fab92baefdd421ee585366c54a4e44a314b1701988acf92f14c4eaa9e5954ec"
          if sha256(ui.encode()).hexdigest() != expected_ui:
              raise SystemExit("UI labor-only payload checksum did not match.")
          ui_path.write_text(ui)

          hardening_path = Path("scripts/apply_labor_only_hardening.py.gz.b64")
          hardening = hardening_path.read_text().strip()
          hardening = hardening.replace("X4R73YLXkQC3ZLfr", "X4R7/YKXkQC3ZKfr")
          expected_hardening = "6c7f672528f8e68bf862e9a8fc71a6ace6fd328ff453f6fa1501721b415236ec"
          if sha256(hardening.encode()).hexdigest() != expected_hardening:
              raise SystemExit("Operational hardening payload checksum did not match.")
          hardening_path.write_text(hardening)
          PY
          base64 --decode scripts/apply_labor_only_core.py.gz.b64 | gzip --decompress > scripts/apply_labor_only_core.py
          base64 --decode scripts/apply_labor_only_ui.py.gz.b64 | gzip --decompress > scripts/apply_labor_only_ui.py
          base64 --decode scripts/apply_labor_only_hardening.py.gz.b64 | gzip --decompress > scripts/apply_labor_only_hardening.py
          echo "717d42a2f09bd991b61c6a7a4cf7bd34ab4a41c8fc80e289136ed043a5a42efa  scripts/apply_labor_only_hardening.py" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_labor_only_ui.py")
          text = path.read_text()
          old_first = "'''          provider business. The accepted quote and messages\n"
          new_first = "'''provider business. The accepted quote and messages\n"
          old_second = "'''          provider business. The accepted labor-only quote and messages\n"
          new_second = "'''provider business. The accepted labor-only quote and messages\n"
          if text.count(old_first) != 1 or text.count(old_second) != 1:
              raise SystemExit("Customer Agreement patch markers did not match exactly.")
          path.write_text(text.replace(old_first, new_first, 1).replace(old_second, new_second, 1))
          PY
          python -W error::SyntaxWarning -m py_compile scripts/apply_labor_only_core.py scripts/apply_labor_only_ui.py scripts/apply_labor_only_hardening.py
          python scripts/apply_labor_only_core.py
          python scripts/apply_labor_only_ui.py
          python scripts/apply_labor_only_hardening.py

      - name: Reconcile regression tests with the labor-only model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "tests/job-operations-controls.test.mjs": [
                  (
                      "  assert.match(card, /Authorized tax and other charges/);",
                      "  assert.match(card, /Provider labor/);\n"
                      "  assert.match(card, /Parts charged through Tuveloz/);\n"
                      "  assert.match(card, /Complete authorized labor amount/);\n"
                      "  assert.doesNotMatch(card, /Authorized tax and other charges/);",
                  ),
              ],
              "tests/maryland-repair-records.test.mjs": [
                  (
                      "  assert.match(page, /Itemized estimate lines/);",
                      "  assert.match(page, /Labor lines and optional customer-supplied-part descriptions/);\n"
                      "  assert.match(page, /part amounts must be 0/);",
                  ),
                  (
                      "  assert.match(page, /mechanic&apos;s work was performed satisfactorily/);",
                      "  assert.match(page, /work was performed satisfactorily/);",
                  ),
              ],
              "tests/provider-freedom-authorizations.test.mjs": [
                  (
                      "  assert.match(page, /Set your own scope, price, timing, and warranty/);",
                      "  assert.match(page, /Set your own labor scope, labor price, timing, and workmanship warranty/);",
                  ),
              ],
              "tests/rendered-html.test.mjs": [
                  (
                      "  assert.ok(contents.includes(\"Compare parts before you decide\"));\n"
                      "  assert.ok(contents.includes(\"before choosing whether you or the provider should supply the parts\"));",
                      "  assert.ok(contents.includes(\"OEM and aftermarket are communication preferences only\"));\n"
                      "  assert.ok(contents.includes(\"They do not add a parts charge to Tuveloz\"));\n"
                      "  assert.ok(contents.includes(\"customer purchases separately\"));",
                  ),
                  (
                      "  assert.ok(providerSource.includes(\"Customer sees\"));",
                      "  assert.ok(providerSource.includes(\"customer-visible status\"));",
                  ),
              ],
          }

          for filename, file_replacements in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in file_replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"Expected exactly one regression marker in {filename}, found {count}: {old}"
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

      - name: Confirm labor-only transactional enforcement
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R 'MarketPriceLinks' app/page.tsx app/provider-jobs/page.tsx
          ! grep -R 'Provider supplies parts' app lib
          ! grep -R 'If the provider supplies parts' app lib
          ! grep -R 'Parts price ($)' app lib
          ! grep -F '\nDROP TRIGGER' drizzle/0045_customer_supplied_parts_preferences.sql
          grep -q 'LABOR_ONLY_QUOTE_REQUIRED' app/api/jobs/route.ts
          grep -q 'scopePrice.partsAmountCents !== 0' app/api/stripe/checkout/route.ts
          grep -q 'LABOR_ONLY_CHANGE_ORDER_REQUIRED' app/api/job-operations/route.ts
          grep -q 'LABOR_ONLY_CANCELLATION_REQUIRED' app/api/job-operations/route.ts
          grep -q 'LABOR_ONLY_INVOICE_REQUIRED' app/api/job-operations/route.ts
          grep -q 'LABOR_ONLY_REPAIR_RECORD_REQUIRED' app/api/repair-records/route.ts
          grep -q 'provider_quotes_labor_only_insert' drizzle/0045_customer_supplied_parts_preferences.sql
          grep -q 'job_change_orders_labor_only_insert' drizzle/0045_customer_supplied_parts_preferences.sql
          grep -q 'repair_authorization_items_labor_only_insert' drizzle/0045_customer_supplied_parts_preferences.sql
          grep -q 'Parts charged through Tuveloz' app/components/quote-payment-card.tsx
          grep -q 'part amounts must be 0' app/repair-records/page.tsx
          grep -q 'customer-visible status' app/provider-jobs/page.tsx

      - name: Upload workspace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: labor-only-debug-${{ github.run_attempt }}
          path: |
            app
            lib
            db
            drizzle
            tests
            scripts
            package.json
            package-lock.json
          retention-days: 1

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply_labor_only_core.py scripts/apply_labor_only_ui.py scripts/apply_labor_only_hardening.py
          rm -f scripts/apply_labor_only_core.py.gz.b64 scripts/apply_labor_only_ui.py.gz.b64 scripts/apply_labor_only_hardening.py.gz.b64
          rm -f scripts/apply_labor_only_hardening.py.gz.b64.part.*
          rm -f .github/workflows/apply-customer-supplied-parts-preferences.yml
          git config user.name 'Tuveloz Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Enforce labor-only OEM and aftermarket preferences'
          git push origin HEAD:agent/customer-supplied-parts-preferences
