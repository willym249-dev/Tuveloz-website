name: Fix remote D1 labor-only migration

on:
  push:
    branches:
      - fix/remote-d1-labor-only-migration

permissions:
  contents: write

concurrency:
  group: fix-remote-d1-labor-only-migration
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/remote-d1-labor-only-migration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Add remote-safe D1 statement boundaries
        run: python scripts/fix_remote_d1_labor_only_migration.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

      - name: Verify migration segmentation
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^--> statement-breakpoint$' drizzle/0048_customer_supplied_parts_preferences.sql)" -eq 43
          node --experimental-strip-types --test tests/customer-supplied-parts-preferences.test.mjs

      - name: Commit verified migration repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/fix_remote_d1_labor_only_migration.py
          rm -f .github/workflows/fix-remote-d1-labor-only-migration.yml
          git config user.name 'Tuveloz Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix remote D1 labor-only migration parsing'
          git push origin HEAD:fix/remote-d1-labor-only-migration
