<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 1080px; height: 1920px;
    background: #050505;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Brand: badge orange #FF6A00, brand navy #07182D, brand black #050505.
     Badge interior is navy, page/canvas stays black — per the brand kit. */
  .stage {
    position: relative;
    width: 1080px; height: 1920px;
    background: linear-gradient(172deg, #07182D 0%, #07182D 38%, #061323 62%, #050505 100%);
    overflow: hidden;
  }
  .keyline { position:absolute; left:0; right:0; top:0; height:12px; background:#FF6A00; }
  .glow { position:absolute; inset:0;
    background: radial-gradient(ellipse 820px 620px at 50% 18%, rgba(255,106,0,0.13) 0%, rgba(255,106,0,0) 60%); }
  .vig { position:absolute; inset:0;
    background: radial-gradient(ellipse 1000px 1400px at 50% 46%, rgba(0,0,0,0) 42%, rgba(0,0,0,.58) 100%); }

  .inner { position:absolute; inset:0; padding: 150px 100px 132px; display:flex; flex-direction:column; }

  .badge-top { width: 132px; height:132px; margin-bottom: 60px; }

  .eyebrow { font-size: 33px; letter-spacing:.30em; text-transform:uppercase; color:#FF6A00; font-weight:700; }
  .rule { width: 96px; height:6px; background:#FF6A00; border-radius:3px; margin-top: 36px; }

  .headline { margin-top: 66px; font-size: 112px; line-height:1.045; font-weight:800; color:#fff; letter-spacing:-.022em; }
  .headline .accent { color:#FF6A00; }
  .headline.small { font-size: 92px; line-height:1.09; }

  .sub { margin-top: 52px; font-size:46px; line-height:1.42; color:rgba(255,255,255,.80); max-width:810px; }

  ul.points { margin-top: 58px; list-style:none; }
  ul.points li { font-size:49px; line-height:1.30; color:#fff; font-weight:700; padding-left:72px; position:relative; margin-bottom:46px; }
  ul.points li:before { content:""; position:absolute; left:0; top:19px; width:30px; height:30px; border-radius:8px; background:#FF6A00; }
  ul.points li span { display:block; font-size:35px; font-weight:400; color:rgba(255,255,255,.62); margin-top:11px; line-height:1.34; }

  .spacer { flex:1; }

  .note { font-size:34px; line-height:1.45; color:rgba(255,255,255,.58);
    border-left:5px solid #FF6A00; padding-left:28px; max-width:820px; }

  .cta { margin-top:56px; align-self:flex-start; background:#FF6A00; color:#07182D;
    font-size:62px; font-weight:800; letter-spacing:-.01em; padding:40px 68px; border-radius:22px; }

  /* Lockup: the real badge + wordmark, exactly as brand/tuveloz-lockup-horizontal.svg */
  .lockup { margin-top:60px; display:flex; align-items:center; gap:30px; }
  .lockup .mark { width:104px; height:104px; flex:none; }
  .lockup .words { line-height:1; }
  .lockup .name { font-size:62px; font-weight:700; color:#FF6A00; letter-spacing:-.005em; }
  .lockup .tag { font-size:29px; color:#FF6A00; margin-top:14px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="vig"></div>
    <div class="keyline"></div>
    <div class="inner" id="inner"></div>
  </div>
<script>
  // The badge, verbatim from brand/tuveloz-icon.svg — not redrawn.
  const BADGE = `<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="31" y="31" width="450" height="450" rx="102" fill="#07182D" stroke="#FF6A00" stroke-width="30"/>
    <path d="M146 150 L366 150 L300 254 L300 342 L212 342 L212 254 Z" fill="#FF6A00" stroke="#FF6A00" stroke-width="26" stroke-linejoin="round"/>
    <path d="M256 380 C241 401 227 417 227 431 A29 29 0 0 0 285 431 C285 417 271 401 256 380 Z" fill="#FF6A00"/>
  </svg>`;

  const LOCKUP = `<div class="lockup">
    <div class="mark">${BADGE}</div>
    <div class="words">
      <div class="name">Tuveloz</div>
      <div class="tag">Customer choice. Provider freedom.</div>
    </div>
  </div>`;

  const TOPBADGE = `<div class="badge-top">${BADGE}</div>`;

  const FRAMES = {
    f1: `<div class="spacer"></div>
      <div class="eyebrow">Montgomery County, MD</div>
      <div class="rule"></div>
      <div class="headline">You already<br>do the work.<br><span class="accent">Now get found.</span></div>
      <div class="sub">A new local marketplace for vehicle services — built for independent providers.</div>
      <div class="spacer"></div>` + LOCKUP,
    f2: `
      <div class="eyebrow">What you get</div>
      <div class="rule"></div>
      <ul class="points">
        <li>Free to join<span>No listing fee. No subscription. No provider fees.</span></li>
        <li>You set your prices<span>Keep 100% of what you quote.</span></li>
        <li>No exclusivity<span>Keep every platform and client you already have.</span></li>
        <li>You pick the jobs<span>No schedule. No minimum acceptance rate.</span></li>
      </ul>
      <div class="spacer"></div>` + LOCKUP,
    f3: `
      <div class="eyebrow">Straight up</div>
      <div class="rule"></div>
      <div class="headline small">We're not open to<br>customers yet.<br><span class="accent">On purpose.</span></div>
      <div class="sub">A marketplace where you post a job and nobody answers is worse than no marketplace. So we're signing up providers first.</div>
      <div class="spacer"></div>
      <div class="note">Applying now means your review is done and you're first in line on day one.</div>` + LOCKUP,
    f4: `<div class="spacer"></div>
      <div class="eyebrow">Fix cars for a living?</div>
      <div class="rule"></div>
      <div class="headline">Your wrench.<br><span class="accent">Your rules.</span></div>
      <div class="sub">Apply in minutes — English o español.</div>
      <div class="spacer"></div>
      <div class="cta">tuveloz.com/join</div>` + LOCKUP
  };

  const FRAMES_ES = {
    f1: `<div class="spacer"></div>
      <div class="eyebrow">Condado de Montgomery, MD</div>
      <div class="rule"></div>
      <div class="headline">Ya haces<br>el trabajo.<br><span class="accent">Ahora que te encuentren.</span></div>
      <div class="sub">Un nuevo mercado local de servicios vehiculares — hecho para proveedores independientes.</div>
      <div class="spacer"></div>` + LOCKUP,
    f2: `
      <div class="eyebrow">Lo que obtienes</div>
      <div class="rule"></div>
      <ul class="points">
        <li>Unirse es gratis<span>Sin cuota de listado. Sin suscripción. Sin cuotas para proveedores.</span></li>
        <li>Tú pones tus precios<span>Quédate con el 100% de lo que cotizas.</span></li>
        <li>Sin exclusividad<span>Conserva cada plataforma y cliente que ya tienes.</span></li>
        <li>Tú eliges los trabajos<span>Sin horario. Sin tasa mínima de aceptación.</span></li>
      </ul>
      <div class="spacer"></div>` + LOCKUP,
    f3: `
      <div class="eyebrow">Directo</div>
      <div class="rule"></div>
      <div class="headline small">Todavía no estamos<br>abiertos a clientes.<br><span class="accent">A propósito.</span></div>
      <div class="sub">Un mercado donde publicas un trabajo y nadie responde es peor que no tener mercado. Por eso primero inscribimos proveedores.</div>
      <div class="spacer"></div>
      <div class="note">Aplicar ahora deja tu revisión lista y te pone primero en la fila el día uno.</div>` + LOCKUP,
    f4: `<div class="spacer"></div>
      <div class="eyebrow">¿Arreglas autos?</div>
      <div class="rule"></div>
      <div class="headline">Tu llave.<br><span class="accent">Tus reglas.</span></div>
      <div class="sub">Solicita en minutos — English o español.</div>
      <div class="spacer"></div>
      <div class="cta">tuveloz.com/join</div>` + LOCKUP
  };
  const params = new URLSearchParams(location.search);
  const key = params.get('f') || 'f1';
  const set = params.get('lang') === 'es' ? FRAMES_ES : FRAMES;
  document.getElementById('inner').innerHTML = set[key];
</script>
</body>
</html>
