<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'X'; src: local('DejaVu Sans'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 1080px; height: 1920px;
    background: #050505;
    font-family: 'DejaVu Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: relative;
    width: 1080px; height: 1920px;
    background:
      radial-gradient(ellipse 900px 700px at 50% 22%, rgba(255,106,0,0.20) 0%, rgba(255,106,0,0) 62%),
      linear-gradient(168deg, #0b2340 0%, #07182D 46%, #050505 100%);
    overflow: hidden;
  }
  /* warm light rake, like late sun across a driveway */
  .rake {
    position:absolute; inset:0;
    background: linear-gradient(103deg, rgba(255,150,60,0) 34%, rgba(255,150,60,0.13) 50%, rgba(255,150,60,0) 66%);
  }
  .grain { position:absolute; inset:0; opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>"); }
  .vig { position:absolute; inset:0;
    background: radial-gradient(ellipse 1000px 1400px at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.66) 100%); }

  .inner {
    position:absolute; inset:0;
    padding: 168px 104px 150px;
    display:flex; flex-direction:column;
  }
  .eyebrow {
    font-size: 33px; letter-spacing: .30em; text-transform: uppercase;
    color: #FF8A33; font-weight: 700;
  }
  .rule { width: 96px; height: 6px; background:#FF6A00; border-radius:3px; margin: 40px 0 0; }

  .headline {
    margin-top: 74px;
    font-size: 116px; line-height: 1.035; font-weight: 800;
    color: #FFFFFF; letter-spacing: -.022em;
  }
  .headline .accent { color: #FF8A33; }
  .headline.small { font-size: 94px; line-height: 1.08; }

  .sub {
    margin-top: 56px;
    font-size: 47px; line-height: 1.42; color: rgba(255,255,255,.80); font-weight: 400;
    max-width: 800px;
  }

  ul.points { margin-top: 66px; list-style:none; }
  ul.points li {
    font-size: 50px; line-height: 1.30; color:#fff; font-weight:600;
    padding-left: 74px; position:relative; margin-bottom: 50px;
  }
  ul.points li:before {
    content:""; position:absolute; left:0; top:20px;
    width:30px; height:30px; border-radius:8px; background:#FF6A00;
  }
  ul.points li span { display:block; font-size:36px; font-weight:400; color:rgba(255,255,255,.62); margin-top:12px; line-height:1.34; }

  .spacer { flex:1; }

  .note {
    font-size: 35px; line-height:1.45; color: rgba(255,255,255,.56);
    border-left: 5px solid rgba(255,106,0,.75); padding-left: 30px; max-width: 810px;
  }

  .cta {
    margin-top: 62px;
    display:inline-block; align-self:flex-start;
    background:#FF6A00; color:#0A0A0A;
    font-size: 50px; font-weight:800; letter-spacing:-.01em;
    padding: 34px 62px; border-radius: 22px;
  }
  .wordmark {
    margin-top: 66px;
    font-size: 41px; font-weight:800; color:#fff; letter-spacing:.03em;
  }
  .wordmark span { display:block; color:rgba(255,255,255,.50); font-weight:400; margin-top:16px; font-size:34px; letter-spacing:.01em; }
  .big-cta { font-size: 66px; padding: 44px 74px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="rake"></div>
    <div class="grain"></div>
    <div class="vig"></div>
    <div class="inner" id="inner"></div>
  </div>
<script>
  const FRAMES = {
    f1: `
      <div class="eyebrow">Montgomery County, MD</div>
      <div class="rule"></div>
      <div class="headline">You already<br>do the work.<br><span class="accent">Now get found.</span></div>
      <div class="sub">A new local marketplace for vehicle services — built for independent providers.</div>
      <div class="spacer"></div>
      <div class="wordmark">TUVELOZ <span>Customer choice. Provider freedom.</span></div>`,
    f2: `
      <div class="eyebrow">What you get</div>
      <div class="rule"></div>
      <ul class="points">
        <li>Free to join<span>No listing fee. No subscription. No provider fees.</span></li>
        <li>You set your prices<span>Keep 100% of what you quote.</span></li>
        <li>No exclusivity<span>Keep every platform and client you already have.</span></li>
        <li>You pick the jobs<span>No schedule. No minimum acceptance rate.</span></li>
      </ul>
      <div class="spacer"></div>
      <div class="wordmark">TUVELOZ <span>English o español</span></div>`,
    f3: `
      <div class="eyebrow">Straight up</div>
      <div class="rule"></div>
      <div class="headline small">We're not open to<br>customers yet.<br><span class="accent">On purpose.</span></div>
      <div class="sub">A marketplace where you post a job and nobody answers is worse than no marketplace. So we're signing up providers first.</div>
      <div class="spacer"></div>
      <div class="note">Applying now means your review is done and you're first in line on day one.</div>
      <div class="wordmark">TUVELOZ</div>`,
    f4: `
      <div class="eyebrow">Fix cars for a living?</div>
      <div class="rule"></div>
      <div class="headline">Your wrench.<br><span class="accent">Your rules.</span></div>
      <div class="sub">Apply in minutes — English o español.</div>
      <div class="spacer"></div>
      <div class="cta big-cta">tuveloz.com/join</div>
      <div class="wordmark">TUVELOZ <span>Montgomery County, MD</span></div>`
  };
  const key = new URLSearchParams(location.search).get('f') || 'f1';
  document.getElementById('inner').innerHTML = FRAMES[key];
</script>
</body>
</html>
